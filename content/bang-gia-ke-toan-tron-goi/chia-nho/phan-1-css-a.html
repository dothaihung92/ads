<style>
.hp3{--ink:#0f172a;--navy:#0a1f44;--blue:#2563eb;--cyan:#06b6d4;--orange:#ff8a00;--amber:#ffb000;--green:#16a34a;--bg:#eef4ff;--line:#dbe6ff;--muted:#5b6b86;color:var(--ink);font-size:17px;line-height:1.65}

.hp3 h3{font-size:1.12em;color:var(--navy);margin:0 0 .5em;line-height:1.3;font-weight:800}
.hp3-sec{margin:56px 0 0}.hp3-eye{display:inline-block;font-size:.74em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);background:var(--bg);border-radius:999px;padding:5px 12px;margin:0 0 10px}

.hp3-hbody{position:relative;padding:46px 40px 42px}

.hp3-tier .per{display:block;font-size:.78em;color:var(--muted)}
.hp3-tier .bar{display:block;height:7px;border-radius:7px;background:#e6eeff;margin-top:14px;overflow:hidden}.hp3-tier .bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
