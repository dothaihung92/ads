<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap&subset=vietnamese');
.hp4,.hp4 *{box-sizing:border-box}
:where(.hp4) a{color:#1D4ED8}
:where(.hp4) a:hover{color:#1238A8}
.hp4 :focus-visible{outline:3px solid #F5A400;outline-offset:2px}

@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,164,0,.65)}70%{box-shadow:0 0 0 18px rgba(245,164,0,0)}100%{box-shadow:0 0 0 0 rgba(245,164,0,0)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes slideup{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

.h4-in1{animation:rise .8s .05s cubic-bezier(.2,.8,.2,1) both}
.h4-in2{animation:rise .8s .2s cubic-bezier(.2,.8,.2,1) both}
.h4-in3{animation:rise .8s .35s cubic-bezier(.2,.8,.2,1) both}
.h4-in4{animation:rise .8s .5s cubic-bezier(.2,.8,.2,1) both}
.h4-ring{position:absolute;border-radius:50%;border:1.5px dashed rgba(255,255,255,.16);pointer-events:none;animation:spin 70s linear infinite}
.h4-ring.h4-rev{animation-direction:reverse;animation-duration:90s}
.h4-price-shine{background:linear-gradient(90deg,#fff 0%,#FFD27A 50%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
.h4-float{animation:bob 5s ease-in-out infinite}
.h4-float.h4-d2{animation-delay:-1.2s}
.h4-float.h4-d3{animation-delay:-2.4s}
.h4-float.h4-d4{animation-delay:-3.6s}

.h4-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:16px;font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap;transition:transform .15s,background .15s}
.h4-btn:hover{transform:translateY(-3px)}
.h4-btn-amber{background:#F5A400;color:#1A1200;animation:pulse 2.2s infinite}
.h4-btn-amber:hover{background:#FFB61F;color:#1A1200}
.h4-btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.h4-btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}
.h4-btn-white{background:#fff;color:#0B1F44}
.h4-btn-white:hover{background:#F4F1EA;color:#0B1F44}

.h4-ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.h4-ticks li{position:relative;padding-left:32px;margin:0}
.h4-ticks li::before{content:"";position:absolute;left:0;top:5px;width:20px;height:20px;border-radius:50%;background:#1D4ED8}
.h4-ticks li::after{content:"";position:absolute;left:7px;top:9px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.h4-ticks.h4-light li::before{background:#F5A400}
.h4-ticks.h4-light li::after{border-color:#1A1200}

.h4-mq{overflow:hidden;border-radius:18px;background:#F5A400;color:#1A1200;margin:16px 0 0}
.h4-mq-track{display:flex;width:max-content;animation:marquee 36s linear infinite}
.h4-mq:hover .h4-mq-track{animation-play-state:paused}
.h4-mq-item{display:flex;align-items:center;gap:22px;padding:14px 0 14px 22px;font-weight:700;font-size:16px;white-space:nowrap}
.h4-mq-item i{display:block;width:8px;height:8px;background:#0B1F44;transform:rotate(45deg)}

.h4-pcard{background:#fff;border:1px solid #E3DDCF;border-radius:28px;overflow:hidden;box-shadow:0 30px 50px -34px rgba(11,31,68,.5)}
.h4-tgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:0 14px;align-items:center}
.h4-thead{background:#0B1F44;color:#fff;padding:20px 30px}
.h4-thead b{display:block;font-size:17px;font-weight:700;line-height:1.3}
.h4-thead small{display:block;font-size:13.5px;color:#B9C6DE;line-height:1.4;margin-top:2px}
.h4-thead .h4-lab{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#B9C6DE}
.h4-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.h4-plist{list-style:none;margin:0;padding:14px;display:grid;gap:6px}
.h4-row{padding:12px 16px;border-radius:14px;background:#F7F5EF;margin:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 55ms + 150ms);transition:background .15s,transform .15s}
.h4-row:hover{background:#E7EEFF;transform:translateX(4px)}
.h4-row.h4-first{background:#FFF1CC}
.h4-row.h4-first:hover{background:#FFE7A8}
.h4-row.h4-end{background:#0B1F44;color:#fff;padding:16px 18px}
.h4-row.h4-end:hover{background:#12306A}
.h4-endmid{grid-column:2 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.h4-rng{font-weight:600;font-size:15.5px;line-height:1.35}
.h4-tag{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:#F5A400;color:#1A1200}
.h4-bar{display:block;margin-top:7px;height:7px;border-radius:7px;background:#E3DDCF;overflow:hidden}
.h4-bar i{display:block;height:100%;border-radius:7px;background:#1D4ED8;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 55ms + 350ms)}
.h4-bar.h4-sx i{background:#E08A00}
.h4-amt{font-size:19px;font-weight:700;color:#0B1F44;font-variant-numeric:tabular-nums;line-height:1.2}
.h4-svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:#E3DDCF;border:1px solid #E3DDCF;border-radius:28px;overflow:hidden;box-shadow:0 30px 50px -34px rgba(11,31,68,.5)}
.h4-svc-col{background:#fff;display:flex;flex-direction:column}
.h4-svc-top{background:#0B1F44;color:#fff;padding:24px 28px 26px;transition:background .2s}
.h4-svc-col:hover .h4-svc-top{background:#12306A}
.h4-svc-tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:5px 12px}
.h4-svc-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#FFD27A}
.h4-svc-list{list-style:none;margin:0;padding:8px 28px 18px;flex:1}
.h4-svc-list li{position:relative;padding:14px 0 14px 34px;border-top:1px solid #EEE9DC;font-size:15.5px;line-height:1.5;margin:0}
.h4-svc-list li:first-child{border-top:0}
.h4-svc-list li::before{content:"";position:absolute;left:0;top:16px;width:20px;height:20px;border-radius:50%;background:#E7EEFF}
.h4-svc-list li::after{content:"";position:absolute;left:7px;top:20px;width:5px;height:9px;border:solid #1D4ED8;border-width:0 2px 2px 0;transform:rotate(45deg)}
.h4-faq details{background:#fff;border:1px solid #E3DDCF;border-radius:18px;margin:0 0 12px;transition:box-shadow .2s}
.h4-faq details:hover{box-shadow:0 14px 26px -20px rgba(11,31,68,.6)}
.h4-faq summary{cursor:pointer;padding:20px 24px;font-weight:700;color:#0B1F44;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px}
.h4-faq summary::-webkit-details-marker{display:none}
.h4-faq summary::after{content:"+";font-size:28px;line-height:1;color:#1D4ED8;font-weight:500;transition:transform .25s}
.h4-faq details[open] summary::after{content:"–"}
.h4-faq details p{margin:0;padding:0 24px 22px;color:#3B4760}
.h4-lift{transition:transform .2s,box-shadow .2s}
.h4-lift:hover{transform:translateY(-6px);box-shadow:0 30px 40px -28px rgba(11,31,68,.55)}
.h4-chip-link{display:inline-block;background:#fff;border:1px solid #E3DDCF;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:600;text-decoration:none;color:#0B1F44;transition:transform .15s,background .15s}
.h4-chip-link:hover{background:#E7EEFF;color:#1238A8;transform:translateY(-2px)}

.h4-fab{position:sticky;bottom:16px;z-index:10;display:flex;justify-content:center;margin-top:24px;pointer-events:none;animation:slideup .8s 1.2s cubic-bezier(.2,.8,.2,1) both}
.h4-fab-in{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;background:#0B1F44;color:#fff;padding:10px 12px 10px 24px;border-radius:999px;box-shadow:0 24px 50px -12px rgba(11,31,68,.8);max-width:100%}
.h4-fab-in .h4-btn{min-height:46px;padding:0 22px;font-size:15.5px;border-radius:999px}

@supports (animation-timeline: view()){
.h4-row{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 70%;animation-delay:0s}
.h4-bar i{animation:grow linear both;animation-timeline:view();animation-range:entry 10% entry 90%;animation-delay:0s}
}
@media (max-width:640px){
.h4-amt{font-size:15px}
.h4-rng{font-size:14px}
.h4-tgrid{gap:0 8px}
.h4-row{padding:12px 10px}
.h4-thead{padding:16px 24px}
.h4-thead b{font-size:14px}
.h4-thead small{font-size:12px}
.h4-btn{width:100%}
.h4-fab-in{border-radius:26px;padding:12px;width:100%}
.h4-fab-in span{display:none}
.h4-fab-in .h4-btn{flex:1 1 140px}
}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important}
}
.hp4 :is(h2,h3,p,li,a,span,b,strong,summary,address,ul,ol,details){font-family:inherit}.hp4 ul,.hp4 ol{list-style:none}.hp4 h2,.hp4 h3{text-transform:none}
@media(max-width:640px){.hp4>div{padding:12px!important}.h4-plist{padding:10px}.h4-row{padding:11px 8px}.h4-row.h4-end{padding:14px 12px}.h4-tgrid{grid-template-columns:minmax(0,.85fr) minmax(0,1fr) minmax(0,1fr);gap:0 6px}.h4-amt{font-size:12.5px;letter-spacing:-.01em}.h4-rng{font-size:13px}.h4-thead{padding:14px 12px}.h4-thead b{font-size:13px}.h4-tag{border-radius:8px;line-height:1.3;padding:3px 8px;font-size:10.5px}}@media(max-width:360px){.h4-amt{font-size:11.3px}.h4-rng{font-size:12px}}
.hp4 .h4-chips{flex-wrap:nowrap!important;gap:8px!important}.hp4 .h4-chips a{white-space:nowrap;padding:9px 14px!important;font-size:14px!important}@media(max-width:960px){.hp4 .h4-chips{flex-wrap:wrap!important}}.hp4 .h4-pills{flex-wrap:nowrap!important;gap:8px!important}.hp4 .h4-pills li{white-space:nowrap;padding:9px 14px!important;font-size:14px!important}@media(max-width:960px){.hp4 .h4-pills{flex-wrap:wrap!important}}.hp4 .h4-svc{grid-template-columns:repeat(3,minmax(0,1fr))}.hp4 .h4-svc-top{display:flex;flex-direction:column;justify-content:space-between;min-height:180px}.hp4 .h4-svc-top h3{margin:0!important}.hp4 .h4-svc-list{margin:0!important;padding:8px 28px 18px!important}.hp4 .h4-plist{margin:0!important;padding:14px!important}.hp4 .h4-ticks{margin-left:0!important;padding-left:0!important}.hp4 li{margin-left:0!important;margin-right:0!important}.hp4 .h4-float{animation:none!important}.hp4 .h4-hero-r b{font-size:28px!important}.hp4 .h4-hero-r span{font-size:17px!important}.hp4 .h4-faq details p{font-size:17px}.hp4 .h4-faq summary{font-size:18px}@media(max-width:860px){.hp4 .h4-svc{grid-template-columns:minmax(0,1fr)}.hp4 .h4-svc-top{min-height:0}}@media(max-width:640px){.hp4 .h4-plist{padding:10px!important}.hp4 .h4-svc-list{padding:6px 18px 14px!important}.hp4 .h4-hero-r b{font-size:22px!important}.hp4 .h4-hero-r span{font-size:15px!important}}
@media(max-width:640px){.hp4 .h4-hd{display:none}.hp4 .h4-rng{font-size:14px!important;font-weight:700}.hp4 .h4-hero-r{grid-template-columns:minmax(0,1fr)!important;grid-auto-rows:auto!important;gap:10px!important}.hp4 .h4-hero-r>div{padding:16px 18px!important}.hp4 .h4-hero-r b{font-size:20px!important}.hp4 .h4-hero-r span{font-size:15px!important}.hp4 .h4-fab{bottom:10px;margin-top:16px}.hp4 .h4-fab-in{flex-wrap:nowrap!important;gap:8px!important;padding:8px!important;border-radius:999px!important;width:100%!important}.hp4 .h4-fab-in .h4-btn{width:auto!important;flex:1 1 0!important;min-height:44px!important;padding:0 12px!important;font-size:15px!important}.hp4 .h4-thead small{display:none}.hp4 .h4-thead b{font-size:12.5px!important}.hp4 .h4-row.h4-end{grid-template-columns:minmax(0,1fr)!important;gap:10px!important}.hp4 .h4-endmid{grid-column:1!important}}
</style>
